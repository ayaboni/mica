{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MICA{% endblock %}</title>
  <meta name="color-scheme" content="light dark">
<script>
(function(){
  var saved = null;
  try { saved = localStorage.getItem('mica_theme'); } catch (e) {}
  var dark = saved ? saved === 'dark'
                   : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/site.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
{% include 'core/_loader.html' %}
{% include 'core/_navbar.html' %}

{% block content %}{% endblock %}

{% include 'core/_footer.html' %}
<script src="{% static 'core/js/site.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
