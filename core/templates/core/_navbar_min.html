<header class="navbar">
  <div class="container">
    <a href="{% url 'home' %}" class="mica-logo-link" title="Back to Home" aria-label="MICA, back to Home">
      {% include 'core/_logo.html' %}
    </a>
    <div class="nav-right">
      {% if nav_link_url %}<a href="{{ nav_link_url }}" class="btn btn-pill">{{ nav_link_label }}</a>{% endif %}
      <button type="button" class="theme-toggle dys-toggle" onclick="toggleDyslexia()" aria-pressed="false" aria-label="Dyslexia-friendly font" title="Dyslexia-friendly font">Aa</button>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>
