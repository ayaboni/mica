{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Change Password — MICA</title>
</head>
<style>
  body{margin:0; font-family:'Nunito', sans-serif; background:#FAF7EE; color:#3A2E28;}
  .topbar{background:#8FA98C; padding:18px 34px; display:flex; align-items:center; justify-content:space-between;}
  .topbar a{color:#3A2E28; text-decoration:none; font-weight:700;}
  .wrap{max-width:420px; margin:60px auto; padding:0 20px;}
  .card{background:#FBF2DE; border-radius:24px; padding:32px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-weight:700; margin-bottom:6px; font-size:14px;}
  .field input{width:100%; padding:12px 14px; border-radius:12px; border:1px solid #ddd; box-sizing:border-box;}
  button{background:#8B6F4E; color:#fff; border:none; padding:13px 28px; border-radius:999px; font-weight:700; cursor:pointer;}
  .back-btn{display:inline-block; background:#8B6F4E; color:#fff; padding:13px 28px; border-radius:999px; font-weight:700; text-decoration:none; margin-top:10px;}
  .msg-success{color:green; font-weight:bold;}
  .msg-error{color:#d9534f; font-weight:bold;}
</style>
</head>
<body>
  {% include 'core/_loader.html' %}

  <div class="topbar">
    <a href="{% url 'account_settings' %}">← Back to Account Settings</a>
    <strong>MICA</strong>
  </div>
  <div class="wrap"><div class="card">
    <h2>Change Password</h2>
    {% if messages %}
    {% for m in messages %}
      <p class="msg-{{ m.tags }}">{{ m }}</p>
    {% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field"><label>Current Password</label>{{ form.old_password }}</div>
      <div class="field"><label>New Password</label>{{ form.new_password1 }}</div>
      <div class="field"><label>Confirm New Password</label>{{ form.new_password2 }}</div>
      <button type="submit">Update Password</button>
    </form>
    <a href="{% url 'account_settings' %}" class="back-btn">Back</a>
    </div>
  </div>
</body>
</html>
